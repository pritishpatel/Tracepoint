[project]
name = "tracepoint"
version = "0.1.0"
description = "AI-native SecOps triage, investigation, remediation, and evidence platform."
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "pydantic",
    "pyyaml",
    "sqlalchemy>=2.0",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["tracepoint", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "N",
    "ANN",
    "RUF",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tracepoint/core/config/loader.py" = ["ANN401"]
"tests/**/*.py" = ["ANN001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
pythonpath = ["."]
